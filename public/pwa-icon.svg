<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <g transform="translate(256,280)" fill="white">
    <!-- Cat ears -->
    <polygon points="-120,-160 -80,-60 -40,-120" opacity="0.9"/>
    <polygon points="120,-160 80,-60 40,-120" opacity="0.9"/>
    <!-- Cat head -->
    <circle cx="0" cy="-40" r="100" opacity="0.95"/>
    <!-- Eyes -->
    <circle cx="-35" cy="-55" r="14" fill="#7C3AED"/>
    <circle cx="35" cy="-55" r="14" fill="#7C3AED"/>
    <circle cx="-30" cy="-58" r="5" fill="white"/>
    <circle cx="40" cy="-58" r="5" fill="white"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-25" rx="8" ry="6" fill="#F9A8D4"/>
    <!-- Mouth -->
    <path d="M-15,-18 Q0,-8 15,-18" stroke="#7C3AED" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="-90" y1="-35" x2="-45" y2="-30" stroke="white" stroke-width="2.5" opacity="0.6"/>
    <line x1="-85" y1="-15" x2="-45" y2="-20" stroke="white" stroke-width="2.5" opacity="0.6"/>
    <line x1="90" y1="-35" x2="45" y2="-30" stroke="white" stroke-width="2.5" opacity="0.6"/>
    <line x1="85" y1="-15" x2="45" y2="-20" stroke="white" stroke-width="2.5" opacity="0.6"/>
    <!-- Paw print below -->
    <circle cx="0" cy="100" r="18" opacity="0.3"/>
    <circle cx="-18" cy="78" r="9" opacity="0.3"/>
    <circle cx="18" cy="78" r="9" opacity="0.3"/>
    <circle cx="-10" cy="65" r="8" opacity="0.3"/>
    <circle cx="10" cy="65" r="8" opacity="0.3"/>
  </g>
</svg>
